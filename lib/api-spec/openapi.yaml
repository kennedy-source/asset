          type: ["string", "null"]
        role:
          type: string
          enum: [super_admin, admin, manager, cashier, production_staff, accountant]
        branch_id:
          type: ["integer", "null"]
        is_active:
          type: boolean
        avatar_url:
          type: ["string", "null"]
        last_login:
          type: ["string", "null"]
        created_at:
          type: string

    UserInput:
